name: Diagnose Bazel 6.5.0 JSONPROTO

on:
  push:
    branches:
      - codex/jsonproto-phase0-diagnostics-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-jsonproto-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Create private temporary diagnostics directory
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          private_dir="$(mktemp -d "${RUNNER_TEMP}/bazel-jsonproto-private.XXXXXXXX")"
          chmod 700 "$private_dir"
          printf 'JSONPROTO_PRIVATE_DIR=%s\n' "$private_dir" >> "$GITHUB_ENV"

      - name: Check inspector Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jsonproto-python-cache
        run: python3 -m py_compile ./scripts/inspect-bazel-jsonproto.py

      - name: Preflight runner and existing regression tests
        run: bash ./scripts/preflight.sh

      - name: Prepare checksum-verified Capsule OTA root filesystems
        id: ota
        run: bash ./scripts/prepare-capsule-rootfs.sh

      - name: Build TensorFlow Lite library with pinned toolchain
        run: bash ./scripts/build-tflite.sh

      - name: Build smoke target and prepare its generated BUILD file
        run: bash ./scripts/prepare-smoke-test.sh

      - name: Collect JSONPROTO matrix and write structural report
        id: jsonproto
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jsonproto-python-cache
        run: |
          set -Eeuo pipefail
          umask 077
          source ./scripts/common.sh
          python3 ./scripts/inspect-bazel-jsonproto.py \
            --tensorflow "$WORK/tensorflow" \
            --bazel "$WORK/bin/bazelisk" \
            --output-user-root "$WORK/bazel-root" \
            --private-dir "$JSONPROTO_PRIVATE_DIR" \
            --report "$ARTIFACTS/bazel-jsonproto-structure-report.txt"

      - name: Collect production JSONPROTO toolchain diagnostics
        id: production_diagnostics
        if: success()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jsonproto-python-cache
        run: bash ./scripts/collect-diagnostics.sh

      - name: Re-run Python syntax and regression suites
        if: always()
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jsonproto-python-cache
        run: |
          python3 -m py_compile ./scripts/collect-bazel-toolchain.py ./scripts/sanitize-toolchain-report.py ./scripts/test_collect_bazel_toolchain.py
          python3 ./scripts/test_verify_elf_abi.py
          python3 ./scripts/test_collect_bazel_toolchain.py

      - name: Validate sanitized diagnostics and prepare public manifest
        id: toolchain_report_safety
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("artifacts")
          reports = [root / "toolchain-library-sanitized.txt", root / "toolchain-smoke-sanitized.txt"]
          forbidden = ("ACTION_SECRET", "Bearer ", "ghp_", "github_pat_", "raw_command=", "action_dump=", "response_file_contents=")
          for report in reports:
              if not report.is_file() or report.stat().st_size == 0:
                  raise SystemExit(f"SANITIZED REPORT CHECK FAILED: {report.name} missing or empty")
              content = report.read_text(encoding="utf-8")
              if any(marker.lower() in content.lower() for marker in forbidden):
                  raise SystemExit(f"SANITIZED REPORT CHECK FAILED: forbidden marker in {report.name}")
              if "execve(" in content or re.search(r"(?m)(?:^|[\s=])/(?!/)", content):
                  raise SystemExit(f"SANITIZED REPORT CHECK FAILED: executable trace or absolute path in {report.name}")
              if re.search(r"(?m)(?:/home/runner/|/tmp/|[A-Za-z]:\\)", content):
                  raise SystemExit(f"SANITIZED REPORT CHECK FAILED: private path in {report.name}")
              print(f"SANITIZED REPORT CHECK PASSED: {report.name} ({report.stat().st_size} bytes)")
          manifest_files = [root / "bazel-jsonproto-structure-report.txt", *reports]
          for item in manifest_files:
              if not item.is_file() or item.stat().st_size == 0:
                  raise SystemExit(f"PUBLIC ARTIFACT INPUT MISSING: {item.name}")
          import hashlib
          lines = []
          for item in manifest_files:
              digest = hashlib.sha256(item.read_bytes()).hexdigest()
              lines.append(f"{digest}  {item.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("PUBLIC SHA256SUMS created for exactly the three uploaded reports.")
          PY
          cat ./artifacts/toolchain-library-sanitized.txt >> "$GITHUB_STEP_SUMMARY"
          cat ./artifacts/toolchain-smoke-sanitized.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.production_diagnostics.outcome }}" != success ]]; then
            printf '\nProduction diagnostics collector outcome: %s (see per-field NOT RESOLVED statuses; this is not an ABI gate).\n' \
              "${{ steps.production_diagnostics.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nProduction diagnostics collector outcome: success.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate report safety and add it to the job summary
        id: report_safety
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ./scripts/inspect-bazel-jsonproto.py \
            --validate-report ./artifacts/bazel-jsonproto-structure-report.txt
          cat ./artifacts/bazel-jsonproto-structure-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated structural and sanitized reports
        id: upload_public_artifact
        if: always() && steps.report_safety.outcome == 'success' && steps.toolchain_report_safety.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bazel-jsonproto-structure-report
          path: |
            artifacts/bazel-jsonproto-structure-report.txt
            artifacts/toolchain-library-sanitized.txt
            artifacts/toolchain-smoke-sanitized.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Download and verify published artifact contents
        if: always() && steps.upload_public_artifact.outcome == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ steps.upload_public_artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/jsonproto-artifact-verify

      - name: Verify downloaded manifest and artifact allowlist
        if: always() && steps.upload_public_artifact.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          downloaded="$RUNNER_TEMP/jsonproto-artifact-verify"
          expected="$RUNNER_TEMP/jsonproto-artifact-expected.txt"
          actual="$RUNNER_TEMP/jsonproto-artifact-actual.txt"
          cat > "$expected" <<'EOF'
          SHA256SUMS
          bazel-jsonproto-structure-report.txt
          toolchain-library-sanitized.txt
          toolchain-smoke-sanitized.txt
          EOF
          find "$downloaded" -type f -printf '%P\n' | LC_ALL=C sort > "$actual"
          LC_ALL=C sort -o "$expected" "$expected"
          if ! cmp -s "$expected" "$actual"; then
            echo 'Downloaded artifact file list does not match the exact upload allowlist.' >&2
            diff -u "$expected" "$actual" >&2 || true
            exit 1
          fi
          (cd "$downloaded" && sha256sum --check --strict SHA256SUMS)
          manifest_names="$RUNNER_TEMP/jsonproto-manifest-names.txt"
          awk '{print $2}' "$downloaded/SHA256SUMS" | LC_ALL=C sort > "$manifest_names"
          expected_manifest="$RUNNER_TEMP/jsonproto-expected-manifest-names.txt"
          printf '%s\n' bazel-jsonproto-structure-report.txt toolchain-library-sanitized.txt toolchain-smoke-sanitized.txt | LC_ALL=C sort > "$expected_manifest"
          if ! cmp -s "$expected_manifest" "$manifest_names"; then
            echo 'Downloaded SHA256SUMS entries do not match the three published reports.' >&2
            exit 1
          fi
          if grep -REn '/home/runner/|/tmp/|[A-Za-z]:\\|ACTION_SECRET|Bearer |ghp_|github_pat_|raw_command=|action_dump=|response_file_contents=|execve\(' \
              "$downloaded/toolchain-library-sanitized.txt" "$downloaded/toolchain-smoke-sanitized.txt"; then
            echo 'Downloaded sanitized report contains a forbidden path, token marker, or private trace marker.' >&2
            exit 1
          fi
          echo 'Downloaded artifact allowlist and all three SHA-256 entries verified.'
          echo '--- Verified downloaded library toolchain report (sanitized) ---'
          cat "$downloaded/toolchain-library-sanitized.txt"
          echo '--- Verified downloaded smoke toolchain report (sanitized) ---'
          cat "$downloaded/toolchain-smoke-sanitized.txt"

      - name: Remove private JSONPROTO diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ -z "${JSONPROTO_PRIVATE_DIR:-}" ]]; then
            echo 'Private diagnostics directory was not created.'
          else
            case "$JSONPROTO_PRIVATE_DIR" in
              "$RUNNER_TEMP"/bazel-jsonproto-private.*)
                rm -rf -- "$JSONPROTO_PRIVATE_DIR"
                echo 'Removed the temporary private diagnostics directory.'
                ;;
              *)
                echo 'Refusing cleanup outside the expected RUNNER_TEMP prefix.' >&2
                exit 1
                ;;
            esac
          fi
          private_toolchain_dir="$(pwd)/work/private-diagnostics"
          if [[ -d "$private_toolchain_dir" ]]; then
            case "$private_toolchain_dir" in
              "$(pwd)/work/private-diagnostics")
                rm -rf -- "$private_toolchain_dir"
                echo 'Removed private action JSONPROTO and toolchain reports.'
                ;;
              *)
                echo 'Refusing cleanup outside the private diagnostics workspace.' >&2
                exit 1
                ;;
            esac
          fi
          artifact_verify_dir="$RUNNER_TEMP/jsonproto-artifact-verify"
          if [[ -d "$artifact_verify_dir" ]]; then
            case "$artifact_verify_dir" in
              "$RUNNER_TEMP/jsonproto-artifact-verify")
                rm -rf -- "$artifact_verify_dir"
                echo 'Removed downloaded sanitized artifact verification copy.'
                ;;
              *)
                echo 'Refusing cleanup outside the artifact verification temp path.' >&2
                exit 1
                ;;
            esac
          fi
