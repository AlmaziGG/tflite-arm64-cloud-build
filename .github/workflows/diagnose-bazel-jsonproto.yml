name: Diagnose Bazel 6.5.0 JSONPROTO

on:
  push:
    branches:
      - codex/jsonproto-phase0-diagnostics-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-jsonproto-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload_public_artifact.outputs.artifact-id }}
    timeout-minutes: 360
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Create private temporary diagnostics directory
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          private_dir="$(mktemp -d "${RUNNER_TEMP}/bazel-jsonproto-private.XXXXXXXX")"
          chmod 700 "$private_dir"
          printf 'JSONPROTO_PRIVATE_DIR=%s\n' "$private_dir" >> "$GITHUB_ENV"

      - name: Check Python, Bash and workflow YAML syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jsonproto-python-cache
        shell: bash
        run: |
          python3 -m py_compile ./scripts/inspect-bazel-jsonproto.py ./scripts/verify-public-artifact.py
          for script in scripts/*.sh; do bash -n "$script"; done
          ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/diagnose-bazel-jsonproto.yml

      - name: Preflight runner and existing regression tests
        run: bash ./scripts/preflight.sh

      - name: Prepare checksum-verified Capsule OTA root filesystems
        id: ota
        run: bash ./scripts/prepare-capsule-rootfs.sh

      - name: Build TensorFlow Lite library with pinned toolchain
        run: bash ./scripts/build-tflite.sh

      - name: Build smoke target and prepare its generated BUILD file
        run: bash ./scripts/prepare-smoke-test.sh

      - name: Collect JSONPROTO matrix and write structural report
        id: jsonproto
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jsonproto-python-cache
        run: |
          set -Eeuo pipefail
          umask 077
          source ./scripts/common.sh
          python3 ./scripts/inspect-bazel-jsonproto.py \
            --tensorflow "$WORK/tensorflow" \
            --bazel "$WORK/bin/bazelisk" \
            --output-user-root "$WORK/bazel-root" \
            --private-dir "$JSONPROTO_PRIVATE_DIR" \
            --report "$ARTIFACTS/bazel-jsonproto-structure-report.txt"

      - name: Collect production JSONPROTO toolchain diagnostics
        id: production_diagnostics
        if: success()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jsonproto-python-cache
        run: bash ./scripts/collect-diagnostics.sh

      - name: Re-run Python syntax and regression suites
        if: always()
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jsonproto-python-cache
        run: |
          python3 -m py_compile ./scripts/collect-bazel-toolchain.py ./scripts/sanitize-toolchain-report.py ./scripts/test_collect_bazel_toolchain.py
          python3 ./scripts/test_verify_elf_abi.py
          python3 ./scripts/test_collect_bazel_toolchain.py

      - name: Validate sanitized diagnostics and prepare public manifest
        id: toolchain_report_safety
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ./scripts/verify-public-artifact.py check-sanitized
          python3 - <<'PY'
          from pathlib import Path
          root = Path("artifacts")
          reports = [root / "toolchain-library-sanitized.txt", root / "toolchain-smoke-sanitized.txt"]
          manifest_files = [root / "bazel-jsonproto-structure-report.txt", *reports]
          for item in manifest_files:
              if not item.is_file() or item.stat().st_size == 0:
                  raise SystemExit(f"PUBLIC ARTIFACT INPUT MISSING: {item.name}")
          import hashlib
          lines = []
          for item in manifest_files:
              digest = hashlib.sha256(item.read_bytes()).hexdigest()
              lines.append(f"{digest}  {item.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("PUBLIC SHA256SUMS created for exactly the three uploaded reports.")
          PY
          cat ./artifacts/toolchain-library-sanitized.txt >> "$GITHUB_STEP_SUMMARY"
          cat ./artifacts/toolchain-smoke-sanitized.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.production_diagnostics.outcome }}" != success ]]; then
            printf '\nProduction diagnostics collector outcome: %s (see per-field NOT RESOLVED statuses; this is not an ABI gate).\n' \
              "${{ steps.production_diagnostics.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nProduction diagnostics collector outcome: success.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate report safety and add it to the job summary
        id: report_safety
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ./scripts/inspect-bazel-jsonproto.py \
            --validate-report ./artifacts/bazel-jsonproto-structure-report.txt
          cat ./artifacts/bazel-jsonproto-structure-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated structural and sanitized reports
        id: upload_public_artifact
        if: always() && steps.report_safety.outcome == 'success' && steps.toolchain_report_safety.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bazel-jsonproto-structure-report
          path: |
            artifacts/bazel-jsonproto-structure-report.txt
            artifacts/toolchain-library-sanitized.txt
            artifacts/toolchain-smoke-sanitized.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Require successful production diagnostics and upload
        if: always()
        shell: bash
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_diagnostics.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_public_artifact.outcome }}
          ARTIFACT_ID: ${{ steps.upload_public_artifact.outputs.artifact-id }}
        run: |
          [[ "$PRODUCTION_OUTCOME" == success && "$UPLOAD_OUTCOME" == success && "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "Required diagnostics or upload failed (production=$PRODUCTION_OUTCOME, upload=$UPLOAD_OUTCOME)." >&2
            exit 1
          }
          python3 ./scripts/verify-public-artifact.py production-gate

      - name: Remove private JSONPROTO diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ -z "${JSONPROTO_PRIVATE_DIR:-}" ]]; then
            echo 'Private diagnostics directory was not created.'
          else
            case "$JSONPROTO_PRIVATE_DIR" in
              "$RUNNER_TEMP"/bazel-jsonproto-private.*)
                rm -rf -- "$JSONPROTO_PRIVATE_DIR"
                echo 'Removed the temporary private diagnostics directory.'
                ;;
              *)
                echo 'Refusing cleanup outside the expected RUNNER_TEMP prefix.' >&2
                exit 1
                ;;
            esac
          fi
          private_toolchain_dir="$(pwd)/work/private-diagnostics"
          if [[ -d "$private_toolchain_dir" ]]; then
            case "$private_toolchain_dir" in
              "$(pwd)/work/private-diagnostics")
                rm -rf -- "$private_toolchain_dir"
                echo 'Removed private action JSONPROTO and toolchain reports.'
                ;;
              *)
                echo 'Refusing cleanup outside the private diagnostics workspace.' >&2
                exit 1
                ;;
            esac
          fi

  verify_artifact:
    needs: inspect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout verification scripts from this run
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download published ZIP by ID and verify contents
        env:
          ARTIFACT_ID: ${{ needs.inspect.outputs.artifact_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ./scripts/verify-public-artifact.py
